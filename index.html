<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Material de apoio do minicurso de Integração Contínua com GitHub Actions, de Otávio Kessler Ustra." />
    <title>Minicurso de CI com GitHub Actions · Material de apoio</title>
    <meta name="theme-color" content="#1e1e2e" />
    <link rel="icon" href="/ci/favicon.svg" type="image/svg+xml" />
    <!-- tema salvo (ou o do sistema) antes da primeira pintura -->
    <script>
      try {
        var t = localStorage.getItem('ci-apoio-tema');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
